{% extends "base.html" %}

{% block title %}User Management - SIM Unit Linker{% endblock %}

{% block content %}
<div class="page-header d-print-none mb-3">
  <div class="row align-items-center">
    <div class="col">
      <div class="page-pretitle">Administration</div>
      <h2 class="page-title">User Management</h2>
    </div>
    <div class="col-auto ms-auto d-print-none">
      <div class="btn-list">
        <a href="/admin/units" class="btn btn-outline-primary">
          <i class="ti ti-cpu me-1"></i> Unit Management
        </a>
      </div>
    </div>
  </div>
</div>

<!-- Admin Sub Navigation Tabs -->
<ul class="nav nav-pills mb-3">
  <li class="nav-item">
    <a class="nav-link active" href="/admin/users">
      <i class="ti ti-users me-1"></i> Users
    </a>
  </li>
  <li class="nav-item">
    <a class="nav-link" href="/admin/units">
      <i class="ti ti-cpu me-1"></i> Units
    </a>
  </li>
</ul>

<div class="row row-cards mt-1">
  <!-- Create User Column -->
  <div class="col-md-4">
    <div class="card">
      <div class="card-header bg-primary-lt">
        <h3 class="card-title"><i class="ti ti-user-plus me-1 text-primary"></i> Create User</h3>
      </div>
      <div class="card-body">
        <form hx-post="/admin/users/create" hx-target="#users-table-container" hx-swap="outerHTML" hx-on::after-request="if(event.detail.successful) this.reset()">
          <div class="mb-3">
            <label class="form-label" for="new-username">Username</label>
            <input type="text" class="form-control" id="new-username" name="username" placeholder="e.g. jdoe" required autocomplete="off">
          </div>
          <div class="mb-3">
            <label class="form-label" for="new-password">Password</label>
            <input type="password" class="form-control" id="new-password" name="password" placeholder="Password" required autocomplete="off">
          </div>
          <div class="mb-3">
            <label class="form-check">
              <input class="form-check-input" type="checkbox" name="is_admin" value="true">
              <span class="form-check-label">Grant Administrator Role</span>
            </label>
          </div>
          <button type="submit" class="btn btn-primary w-100">
            <i class="ti ti-plus me-1"></i> Add User
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- Users List Column -->
  <div class="col-md-8">
    <div class="card">
      <div class="card-header">
        <h3 class="card-title"><i class="ti ti-users me-1 text-muted"></i> System Users</h3>
      </div>
      
      {% include "partials/users_table.html" %}

    </div>
  </div>
</div>
{% endblock %}
