<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <meta http-equiv="X-UA-Compatible" content="ie=edge"/>
    <title>Login - SIM Unit Linker</title>
    <!-- Tabler Core CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css">
    <!-- Tabler Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
      :root {
        --tblr-font-sans-serif: 'Inter', -apple-system, BlinkMacSystemFont, San Francisco, Segoe UI, Roboto, Helvetica Neue, sans-serif;
      }
      body {
        font-family: var(--tblr-font-sans-serif);
      }
    </style>
  </head>
  <body class="d-flex flex-column" data-bs-theme="light">
    <script>
      // Load and apply theme immediately to prevent flashing
      const savedTheme = localStorage.getItem('theme') || 'light';
      document.body.setAttribute('data-bs-theme', savedTheme);
    </script>
    <div class="page page-center">
      <div class="container container-tight py-4">
        <div class="text-center mb-4">
          <a href="#" class="navbar-brand navbar-brand-autodark">
            <span class="fs-1 fw-bold text-primary">
              <i class="ti ti-link me-2"></i>SIM-Unit Linker
            </span>
          </a>
        </div>
        
        {% if error %}
        <div class="alert alert-danger" role="alert">
          <div class="d-flex">
            <div>
              <i class="ti ti-alert-triangle me-2"></i>
            </div>
            <div>
              {{ error }}
            </div>
          </div>
        </div>
        {% endif %}

        <div class="card card-md">
          <div class="card-body">
            <h2 class="h2 text-center mb-4">Login to your account</h2>
            <form action="/login" method="post" autocomplete="off" novalidate>
              <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" autocomplete="off" required>
              </div>
              <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <div class="input-group input-group-flat">
                  <input type="password" class="form-control" id="password" name="password" placeholder="Your password" autocomplete="off" required>
                </div>
              </div>
              <div class="form-footer">
                <button type="submit" class="btn btn-primary w-100">Sign in</button>
              </div>
            </form>
          </div>
        </div>
        
      </div>
    </div>
    <!-- Tabler Core JS -->
    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/js/tabler.min.js" defer></script>
  </body>
</html>
