<div id="users-table-container">
  <div class="table-responsive">
    <table class="table table-vcenter card-table table-hover">
      <thead>
        <tr>
          <th>Username</th>
          <th>Role</th>
          <th class="w-1">Action</th>
        </tr>
      </thead>
      <tbody>
        {% for u in users %}
        <tr>
          <td>
            <div class="d-flex align-items-center">
              <span class="avatar avatar-sm me-2 bg-blue-lt"><i class="ti ti-user"></i></span>
              <span class="font-weight-semibold">{{ u.username }}</span>
            </div>
          </td>
          <td>
            {% if u.is_admin %}
            <span class="badge bg-purple-lt"><i class="ti ti-shield-check me-1"></i> Administrator</span>
            {% else %}
            <span class="badge bg-blue-lt">Operator</span>
            {% endif %}
          </td>
          <td>
            <div class="d-flex align-items-center gap-2">
              <form hx-post="/admin/users/password/{{ u.id }}" hx-swap="none" hx-on::after-request="if(event.detail.successful) this.reset()" class="d-flex align-items-center gap-1">
                <input type="password" name="new_password" class="form-control form-control-sm" style="width: 130px;" placeholder="New password" required autocomplete="new-password">
                <button type="submit" class="btn btn-sm btn-outline-primary" title="Update Password">
                  <i class="ti ti-key"></i>
                </button>
              </form>
              
              {% if u.id == current_user.id %}
              <span class="text-muted small italic ms-2">Logged In</span>
              {% else %}
              <button class="btn btn-sm btn-outline-danger ms-2" 
                      hx-post="/admin/users/delete/{{ u.id }}" 
                      hx-target="#users-table-container" 
                      hx-swap="outerHTML"
                      hx-confirm="Are you sure you want to delete user {{ u.username }}?">
                <i class="ti ti-trash me-1"></i> Delete
              </button>
              {% endif %}
            </div>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
